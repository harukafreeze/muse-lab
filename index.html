<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>muse lab · 从听出「落」到写出自己的 8 小节</title>
<meta name="description" content="给 Vocaloid 写歌的人用的练习站：十二课，先听再动手，最后导出一个能拖进 Studio One 的 8 小节。声音全部由浏览器现场合成。">
<link rel="stylesheet" href="css/style.css">
<script>
  // 在首屏绘制之前就把主题定下来，不然会闪一下
  try {
    document.documentElement.setAttribute('data-theme', localStorage.getItem('muse.theme') || 'light');
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
</script>
</head>
<body>

<header class="topbar">
  <a class="brand" href="#/">muse<span>lab</span></a>
  <nav class="site-nav">
    <a href="#/" data-nav="home">课程</a>
    <a href="#/practice" data-nav="practice">练习</a>
    <a href="#/analyze" data-nav="analyze">拆歌</a>
    <a href="#/listen" data-nav="listen">听写</a>
  </nav>
  <span class="pill" id="pill">0 / 12</span>
  <button class="theme-btn" id="themebtn" title="切换深浅色" aria-label="切换深浅色">☾</button>
</header>

<main id="app"></main>

<footer class="site-foot">
  <div class="foot-row">
    <span><b>muse lab</b> · 写歌练习站</span>
    <span>没有账号，没有云端，进度只存在这台机器上</span>
  </div>
  <div class="foot-row">
    <span>Web Audio 现场合成 · 没有音频素材 · 没有构建步骤</span>
    <a href="https://github.com/harukafreeze/muse-lab" target="_blank" rel="noopener">源码</a>
  </div>
</footer>
